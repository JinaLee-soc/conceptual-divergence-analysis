name: record-fixtures

# Optional live demo recording on Linux. Requires the ANTHROPIC_API_KEY
# repository secret and costs approximately $0.10–0.15 per term. The workflow
# uploads the resulting fixtures and commits changes to the selected branch.
# The recording is keyed by the configured llm.model, so it is a new file
# beside the committed claude-code-session fixtures; a mock demo prefers it.
# Regular CI replays the committed authored fixtures for both demo terms.

on:
  workflow_dispatch:
    inputs:
      term:
        description: "Demo term to (re)record on Linux"
        required: true
        default: "consensus"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      # The last step commits the recorded fixture back to the branch.
      contents: write
    env:
      # Untrusted input reaches scripts only as a quoted variable, never as
      # expression text spliced into the script.
      TERM_INPUT: ${{ inputs.term }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the term input
        run: |
          case "$TERM_INPUT" in
            *[!a-z]*|"") echo "::error::term must be lowercase letters only"; exit 1 ;;
          esac

      - name: Install package
        run: pip install -e .

      - name: Record the fixture on Linux (one live LLM call)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it under" \
                 "Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          cda demo --term "$TERM_INPUT" --record-fixtures

      - name: Prove the NEW recording replays offline (no key, no network)
        # A plain mock run would also pass by falling back to the committed
        # claude-code-session fixture, so the report header must name the
        # configured model: only the new recording can produce that.
        env:
          HF_HUB_OFFLINE: "1"
          ANTHROPIC_API_KEY: ""
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from cda.demo import demo_config, find_demo_dir, run_demo

          model = str(demo_config(find_demo_dir()).get("llm.model"))
          result = run_demo(term=os.environ["TERM_INPUT"], mock=True)
          assert result["status"] == "ok", result
          header = Path(result["report_file"]).read_text(encoding="utf-8").splitlines()[0]
          assert f"| model: {model} |" in header, (
              f"mock replay did not use the new {model} recording: {header}"
          )
          print(f"replayed the new {model} recording: {header}")
          PY

      - name: Upload the fixture as a build artifact (manual-commit fallback)
        uses: actions/upload-artifact@v4
        with:
          name: fixtures-${{ inputs.term }}-linux
          path: demo/fixtures/*.json

      - name: Commit the new fixture to the branch you ran from
        run: |
          # Stage first: a new recording is an untracked file, which
          # `git diff` without --cached would never report.
          git add demo/fixtures
          if git diff --cached --quiet -- demo/fixtures; then
            echo "No fixture change: this recording already ships."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "demo: record $TERM_INPUT fixture on linux/x64 for cross-platform offline replay"
          git push

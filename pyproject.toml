[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cda"
version = "1.0.0"
description = "Conceptual Divergence Analysis: compare how a researcher uses key theoretical terms against a researcher-curated literature corpus"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [
    { name = "Jina Lee" },
    { name = "Zhuofan Li" },
]
keywords = ["scientometrics", "semantic-analysis", "research-infrastructure", "LLM"]

# Exact pins from the tested build environment (Python 3.11.14).
# Reproducibility beats freshness for a paper-accompanying release — bump
# versions only with a re-run of the full test suite and demo.
# scipy stays at 1.17.1: scipy 1.18+ requires Python >= 3.12, which would
# silently break the advertised Python 3.11 floor above.
dependencies = [
    "chromadb==1.5.9",
    "sentence-transformers==5.6.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "anthropic==0.115.1",
    "pyyaml==6.0.3",
    "docx2python==3.7.1",
    "pysbd==0.3.4",
    "python-dateutil==2.9.0.post0",
    "pymupdf==1.28.0",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
gui = ["streamlit==1.58.0", "matplotlib==3.11.1"]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
    "pre-commit==4.6.0",
    "detect-secrets==1.5.0",
]

[project.scripts]
cda = "cda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cda = ["defaults.yaml", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # long lines in prompts/docstrings are acceptable; format handles code
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' -q"
markers = [
    "integration: requires the real sentence-transformers model (downloads ~90 MB); run with -m integration",
]

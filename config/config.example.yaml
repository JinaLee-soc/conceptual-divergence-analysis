# =============================================================================
# CDA configuration — fully commented example
# =============================================================================
# Copy this file (e.g. to my-config.yaml), edit it, and pass it to the CLI:
#
#     cda analyze --term novelty --config my-config.yaml
#
# Anything you omit falls back to config/defaults.yaml, which carries the
# values reported in the accompanying paper. Two defaults follow the revised
# manuscript rather than the earlier published runs: `clustering.mode: joint`
# and `saturation.scope: prompt`. Comments below state each parameter's role
# in the method and flag where a default departs from the earlier runs.
#
# Two safety rails on this file:
#   - A key left empty (`seed:`) or set to null (`output_dir: ~`) means
#     "use the default" — it never overrides a default with nothing.
#     (Note: a bare `~` is YAML's null, NOT your home directory; write
#     the path out if you mean a directory under home.)
#   - Misspelled keys are rejected at load time with a suggestion, so a
#     typo like `metod:` cannot silently leave the default in force.

paths:
  # Where your corpus lives. The ChromaDB vector store is created at
  # <corpus_dir>/chroma by `cda ingest`. Never committed to git — and best
  # kept on a local, non-synced disk: a cloud-sync client (Dropbox, OneDrive,
  # iCloud) rewriting the store's database files mid-ingest can corrupt it.
  # If the repository clone lives in a synced folder, point this somewhere
  # local instead.
  corpus_dir: ./corpus
  # Directory of your own working drafts (.docx, .md, .txt, .pdf). Drafts are
  # always classified as researcher-authored — the "direct draft inclusion"
  # signal of MyWork resolution.
  drafts_dir: ./drafts
  # Where timestamped markdown reports are written. Reports accumulate here,
  # enabling longitudinal comparison across runs.
  output_dir: ./outputs
  # Optional path to a register-assignment prompt file. Leave null to use the
  # versioned prompt shipped with the package (prompts/register_assignment_v5.md,
  # the paper's appendix template).
  prompt_file: null

corpus:
  # Name of the ChromaDB collection created at ingest and queried at analysis.
  collection: cda_corpus
  # Ingestion chunking: PDFs are split into overlapping word windows before
  # embedding. 500/100 mirrors the corpus construction used in the paper.
  # chunk_size_words must be at least 20, and larger than chunk_overlap_words.
  # Every word of a document lands in at least one window.
  chunk_size_words: 500
  chunk_overlap_words: 100

  # Which files under --pdf-dir get ingested.
  #
  # A curated library folder often holds sub-folders that are not literature —
  # agent output, exported reports, book scans. The default recursive walk
  # takes all of them, which quietly changes what "the literature" means in
  # every later analysis. Turn the walk off, or name the sub-folders to skip.
  #
  #   recursive: false            # only files sitting directly in --pdf-dir
  #   exclude: ["outputs", "*.draft.pdf"]
  #
  # A pattern matching a directory name skips that whole sub-tree; a pattern
  # with wildcards is matched against the file's path relative to --pdf-dir.
  # The CLI flags --no-recursive and --exclude add to whatever is set here.
  recursive: true
  exclude: []

embedding:
  # Sentence-embedding model used for the vector index, passage clustering,
  # and the saturation ranking anchor. Pinned to the model reported in the
  # paper; changing it invalidates comparisons with published results and
  # requires re-ingesting the corpus.
  model: sentence-transformers/all-MiniLM-L6-v2
  # Hugging Face commit of the model snapshot. Pinned so every run embeds with
  # the same weights; the run manifest records the resolved_revision it used.
  revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"  # pragma: allowlist secret
  # Note: embeddings are L2-normalized before clustering (spherical k-means
  # on the unit hypersphere, cosine distance). This is fixed by design, not
  # configurable — the paper's divergence mapping depends on it.

retrieval:
  # Literal keyword retrieval only; embeddings are used after extraction.
  keyword_max_chunks: 0 # 0 = all matching chunks; a positive cap warns when reached
  window_mode: sentence # context is an explicit non-paper alternative
  min_window_chars: 0 # no neighboring sentences by default
  max_window_chars: 0 # no sentence truncation by default

mywork:
  # MyWork resolution: separates researcher-authored passages from literature
  # passages. Signals are tried in this order; the first match wins, and the
  # classification reason is logged per passage. Drafts from paths.drafts_dir
  # are a separate, always-researcher channel (the fifth signal).
  priority: [filename_patterns, metadata_flags, zotero_tags, profile_titles]
  # Glob patterns matched (case-insensitively) against the file name and its
  # stem, so "lee_2020.pdf" and "lee_2020" both work. Use for working papers
  # whose names won't match published titles, e.g.:
  #   filename_patterns: ["*_draft_*", "myproject_*"]
  filename_patterns: []
  # Titles of your own published/indexed papers, used for fuzzy title
  # matching against corpus file names ("profile title matching").
  #   publication_titles: ["The Exact Title of My Published Paper"]
  publication_titles: []
  # Title matching thresholds: minimum shared content words and minimum share
  # of the title's content words that must overlap. English stop words and
  # words under three letters do not count; a title with fewer content words
  # than title_match_min_overlap is rejected at load (it could never match).
  title_match_min_overlap: 3
  title_match_min_ratio: 0.55


clustering:
  # Divergence mapping, stage 2: spherical k-means over the term's passages.
  #
  # mode: how the two corpora are partitioned.
  #   joint (default) — researcher and literature passages are pooled into ONE
  #     k-means partition, and the report shows where your passages sit inside
  #     each shared cluster. Cluster numbers then mean the same thing on both
  #     sides, and the >80% / <10% flags below are direct membership counts.
  #   independent — each corpus is partitioned separately and your passages are
  #     located in the literature by cross-assignment to the nearest literature
  #     centroid. Legacy alternative; the paper uses joint mode.
  mode: joint
  # method / k: the resolution controls.
  # On real corpora the silhouette-vs-k landscape is often nearly flat, so
  # which k "wins" is close to arbitrary; these two keys let you make the
  # granularity an explicit choice instead.
  #   method: kmeans (default, the paper's spherical k-means) | hierarchical
  #     (one deterministic average-linkage tree over the passages, cut at the
  #     chosen resolution; cuts are pure — min_cluster_size is not applied —
  #     so coarse cuts are exact unions of fine cuts, and `cda validate` lets
  #     you move the cutoff line on the dendrogram afterwards).
  #   k: auto (default, silhouette-selected — the paper's rule) | an integer
  #     >= 2 that pins the number of clusters. Applies to the final partition
  #     (joint, or per-corpus under independent mode); the saturation sweep's
  #     internal clustering always uses the paper's rule.
  method: kmeans
  k: auto
  # Random seed for k-means initialization, restarts, and silhouette
  # subsampling. Fixed for reproducibility; the only remaining
  # nondeterminism in the pipeline is the LLM call itself.
  seed: 42
  # Random restarts per candidate k; the best inertia wins ("multiple random
  # restarts" in the paper).
  kmeans_restarts: 5
  # Iteration cap per restart.
  kmeans_max_iter: 80
  # k is selected by silhouette maximization (cosine) over k = 2..max_k.
  # These two apply to independent mode (one sweep per corpus)...
  researcher_max_k: 8
  literature_max_k: 15
  # ...and this one to joint mode (a single sweep over the pooled passages).
  # The pooled set is usually literature-dominated, so it matches
  # literature_max_k by default.
  joint_max_k: 15
  # Clusters smaller than this are merged into their nearest cluster
  # (cosine distance between centroids) after k-selection.
  min_cluster_size: 3
  # Silhouette is computed on a random subsample above this size to avoid
  # O(n²) memory blowups on large passage sets.
  silhouette_subsample: 2000
  # Representative passages per cluster passed to the LLM, selected by
  # centroid proximity (the five passages closest to each cluster centroid,
  # per the paper's appendix).
  representatives_per_cluster: 5
  stability_check:
    # A canonical run is fully reproducible — same passages, same order,
    # same k, every time — but that is not the same as the result being
    # *robust*. This LLM-free check re-clusters the identical, already-
    # selected passage set under 30 independently shuffled orderings and
    # reports the distribution of the k they select, folded into every
    # report's "Clustering Stability" section. A low match rate flags a term
    # whose reported k is one plausible partition among several nearby ones,
    # not the term's one true register count — most common for terms with
    # low silhouette scores (see docs/interpretation_guide.md).
    enabled: true
    # Total trials, including the canonical run (so `trials: 31` means 30
    # additional shuffled clusterings). Fewer than 2 disables the check.
    # Thirty is the default because a handful of shuffles cannot separate
    # "reproduced" from "reproduced once by luck" — on a large corpus it
    # adds several minutes of local clustering to a run, and lowering it
    # is the right trade when you are iterating rather than reporting.
    trials: 31
    seed_base: 0

timeframe:
  # Fix the corpus to a window of library-acquisition time — Zotero's
  # "Date Added", i.e. when YOU added each work, never its publication year.
  # A personal corpus grows, so without a window "the corpus" means something
  # different each month and a result cannot be reproduced later. With one,
  #   cda analyze --term novelty --added-to 2026-05-01
  # analyzes your library exactly as it stood at the end of 1 May 2026.
  # Both bounds null (the default) = the whole corpus, as before.
  #
  # Dates are YYYY-MM-DD (or "YYYY-MM-DD HH:MM:SS" to bound to the second),
  # read as UTC dates: every stored acquisition time is UTC (Zotero writes
  # "Date Added" in UTC; file times are converted), so a window selects the
  # same works on any machine. added_to is inclusive of the whole UTC day; a
  # bound that cannot be parsed, or names an impossible date, is an error,
  # never a silently ignored filter. Quote the dates, for example
  #   added_to: "2026-05-01"
  # (unquoted dates also work: CDA reads them back as the same text).
  added_from: null
  added_to: null
  # Passages whose source has no "Date Added" cannot be placed on either side
  # of a cutoff, so a window drops them and the report says how many. Set true
  # only when your corpus has no Zotero metadata at all and you accept that the
  # window is then advisory. Your drafts are never filtered either way: they
  # are the manuscript under examination, not works acquired in a period.
  include_undated: false
  # Which acquisition clock the window reads. Both are written at ingest time,
  # so switching costs nothing but re-running the analysis:
  #   zotero      Zotero's "Date Added" — when the record entered your library.
  #               The paper's clock, and what `cda emergence` documents. If your
  #               Zotero library was ever rebuilt or re-imported, every date
  #               collapses onto the rebuild; check before trusting a window.
  #   filesystem  When the PDF file arrived on disk (birth time where the OS
  #               records one). Survives a Zotero rebuild and needs no export,
  #               but tracks the download rather than the reading.
  # Reports name the clock they used, so two runs are never confusable.
  date_source: zotero

saturation:
  # Saturation-based subsampling of the literature corpus (paper §3.3):
  # candidates are ranked by cosine similarity to the target term's embedding
  # (an external anchor, independent of researcher and literature registers)
  # and added in increments until cluster structure stabilizes.
  enabled: true
  # What saturation governs. "prompt" is the DEFAULT: the FULL retrieved
  # pool feeds the clustering and the flags, no subsampling touches the
  # geometry, and the prompt stays bounded anyway because it carries
  # clusters x representatives rather than passages.
  # "sample" is the earlier published method: the saturated subsample feeds
  # the clustering, the silhouettes, the flags, and the prompt — set it to
  # reproduce the published runs.
  #
  # Why "prompt" is the default: the sweep's ARI stopping rule halts
  # preferentially on coarse structure and the term-anchored ranking samples only the most
  # term-central passages, which can suppress fine cluster structure and omit
  # regions of the retrieved pool. Results under the two scopes are not
  # comparable; every report and prompt states which scope produced it.
  scope: prompt
  # First increment size and step size of the sweep.
  start: 50
  step: 25
  # Hard cap: when saturation is not reached, the maximum sampled 1,200
  # passages are used and the report flags it (paper's reported value).
  max_passages: 1200
  # Stability criterion: adjusted Rand index (ARI) between consecutive
  # increments, computed on the overlapping prefix.
  ari_threshold: 0.8
  # Saturation is declared after this many consecutive increments at or above
  # the ARI threshold; the earlier plateau N is selected (conservative).
  consecutive_increments: 2
  # Ranking anchor: "term" = cosine similarity to the target term embedding
  # (the paper's method); "similarity" = reuse retrieval similarity scores.
  ranking: term

figure:
  # Passage map (written as <report>.png next to every report): the shared
  # partition drawn in the pooled embedding space, projected to 2D by PCA.
  # Literature passages are dots, yours are stars, and both take the colour of
  # the shared cluster they landed in.
  #
  # It answers a question the flag tables cannot. A "researcher-concentrated"
  # cluster can mean you occupy a region the literature genuinely does not, or
  # that the literature was never sampled there — identical in a table, obvious
  # in the plot. Deterministic and LLM-free; skipped by --dry-run.
  enabled: true
  # Raster resolution. 300 is print-quality; raise for a poster, lower for a
  # quick look.
  dpi: 300

emergence:
  # EXPERIMENTAL (post-paper addition, not part of the manuscript's method).
  # `cda emergence --term X` tracks how the literature clusters for a term
  # emerged as you expanded your library: passages are ordered by Zotero's
  # "Date Added" (your acquisition trajectory — NOT publication year), then
  # cumulative snapshots are clustered with the same seeded k-means and
  # matched to the final clustering by centroid cosine similarity. Needs
  # `date_added` in chunk metadata: re-ingest with your Zotero CSV
  # (`cda ingest --reingest --zotero-csv ...`) on corpora built before this
  # feature. Passages without a date are excluded and reported, never guessed.
  # First cumulative snapshot size and step, in acquisition-ordered passages.
  start: 20
  step: 10
  # Minimum centroid cosine for a snapshot cluster to count as a precursor of
  # a final cluster; below it, snapshot structure is treated as transient.
  match_threshold: 0.80

validation:
  # EXPERIMENTAL (post-paper addition, not part of the manuscript's method).
  # `cda validate --term X` starts a researcher-led validation session for the
  # clustering: you record a blind verdict per cluster (coherent / mixed /
  # overlaps / artifact) BEFORE seeing an LLM agent's independent reading of
  # the same passages, then optionally curate (merge/split with agent advice).
  # The verdict trail and researcher-vs-agent agreement are the validity
  # evidence; curation never feeds back into `cda analyze`.
  # Reader models for the independent cluster readings. Empty list = the
  # pinned llm.model, plus llm.verification_model when that is set. Entries
  # use the same "provider:model" spec form as llm.verification_model.
  readers: []
  # How many passages the session shows per cluster (centroid-nearest
  # representatives first, then next-nearest members); also what the reader
  # agent sees.
  passages_shown_per_cluster: 8

flags:
  # Divergence flagging (paper §3.3). How the researcher's instances in a
  # cluster are counted follows clustering.mode: under joint clustering they
  # are the cluster's researcher members; under independent clustering they are
  # researcher passages cross-assigned to the nearest literature centroid. The
  # report always states which basis produced the table.
  #
  # A cluster is flagged researcher-concentrated when BOTH hold:
  # researcher instances exceed this share of the cluster's combined
  # (researcher + literature) membership...
  researcher_share_threshold: 0.80
  # ...while the cluster accounts for less than this share of all literature
  # passages.
  literature_share_threshold: 0.10
  # A cluster is flagged as underrepresented in researcher usage when it holds
  # (joint) or receives (independent) at most this many researcher passages.
  underrepresented_max_researcher_passages: 0

llm:
  # Register assignment, stage 3. Model pinned to the paper's reported model.
  #
  # A bare name is Anthropic (needs ANTHROPIC_API_KEY). The "provider:model"
  # form that verification_model already takes works here too, so
  #   model: "openai:gpt-4o"      # needs OPENAI_API_KEY, and OPENAI_BASE_URL
  #                               # for any OpenAI-compatible endpoint
  # runs the analysis elsewhere. Changing this means the run is no longer the
  # paper's configuration: say so when reporting results, and note that
  # recorded fixtures are keyed by model, so a fixture recorded under one model
  # will not replay under another (by design).
  model: claude-sonnet-4-6
  # Response budget and sampling temperature used in the paper's runs.
  max_tokens: 6000
  temperature: 0.0
  # EXPERIMENTAL: a second model for multi-model verification. When set,
  # `cda verify` re-runs register assignment on identical cluster summaries
  # and emits an agreement/discrepancy table. Can also be set via the
  # CDA_VERIFICATION_MODEL environment variable.
  verification_model: null

analysis:
  # Minimum researcher passages required before a term is analyzed; below
  # this the run is skipped with an explanatory message.
  min_researcher_passages: 1

# The five-point ordinal semantic-distance scale (paper §3.3). These labels
# are rendered as a legend in every report; the same anchors appear in the
# register-assignment prompt. Changing them here changes the report legend
# only — the prompt is versioned separately in prompts/.
distance_scale:
  1: terminological variants
  2: overlapping usage
  3: adjacent usage
  4: distinct registers
  5: incommensurable

# Optional research theme tags passed to the LLM for cluster labeling
# (the RESEARCHER CONTEXT block of the prompt). No other researcher
# information is sent.
#   themes:
#     - tag: evaluation-theory
#       description: How scientific work is judged and valued
themes: []

diagnose:
  # OpenAlex field names used as the coverage baseline by `cda diagnose`
  # (see the report's "structurally untouched areas" section). Field names
  # are OpenAlex's ~26 top-level fields, e.g. "Social Sciences", "Arts and
  # Humanities". Leave empty to skip the baseline comparison. Can also be
  # passed per run: cda diagnose --fields "Social Sciences"
  declared_fields: []
